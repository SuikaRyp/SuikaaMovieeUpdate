name: Build APK (Release + Debug)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.mode }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 kosong -> build pakai debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<PROPS
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.keystore
          PROPS

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (${{ matrix.mode }})
        run: flutter build apk --${{ matrix.mode }}

      - name: Rename APK
        id: rename
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//' | tr -d '\r')"
          SUFFIX=""
          if [ "${{ matrix.mode }}" = "debug" ]; then SUFFIX="-debug"; fi
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk" "dist/SuikaMovie-${VERSION}${SUFFIX}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikaMovie-${{ matrix.mode }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
